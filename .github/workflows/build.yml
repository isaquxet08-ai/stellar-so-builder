name: Build Native SO

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Configure CMake
      run: |
        cmake -B build \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_BUILD_TYPE=Release .

    - name: Build All SOs
      run: |
        cmake --build build -- -j4

    - name: Package SOs
      run: |
        mkdir -p output
        # 把所有生成的 .so 文件放进一个文件夹里
        find build -name "*.so" -exec cp {} output/ \;
        cd output && zip -r ../so-modules.zip . && cd ..

    - name: Upload SO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: precompiled-so-modules
        path: so-modules.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: so-build-${{ github.run_number }}
        name: 预编译模块包 (Build ${{ github.run_number }})
        body: |
          包含 libstellar.so 等底层核心文件，主项目会自动拉取。
        files: so-modules.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
